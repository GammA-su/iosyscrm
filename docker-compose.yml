name: prospect-crm

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: prospect-crm:local
  env_file:
    - .env
  environment:
    # Valeur FIXE, jamais interpolée. Compose lit `.env` pour l'interpolation :
    # un `${DATABASE_URL:-...}` reprendrait la valeur destinée à l'hôte
    # (`@localhost`) et les conteneurs échoueraient en « Connection refused ».
    # L'adresse hôte et l'adresse du réseau interne sont structurellement
    # différentes et ne partagent jamais une variable. Voir README, §
    # « Deux adresses de base de données ».
    DATABASE_URL: postgresql+psycopg://crm:crm@postgres:5432/prospectcrm
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - internal
  restart: unless-stopped

services:
  # Aucune clé `ports` ici : la base n'est joignable que depuis le réseau
  # interne. Le poste de développement publie 127.0.0.1:5432 via
  # docker-compose.override.yml, chargé automatiquement par Compose et absent
  # des serveurs (voir docker-compose.override.yml.example).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: prospectcrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `-h 127.0.0.1` est indispensable : pendant `initdb`, l'entrypoint
      # démarre un serveur temporaire qui n'écoute que sur la socket Unix.
      # Sans cette option, la base serait déclarée saine avant sa vraie
      # ouverture, et `app` se connecterait pendant l'arrêt intermédiaire.
      test: ["CMD-SHELL", "pg_isready -U crm -d prospectcrm -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - internal
    restart: unless-stopped

  app:
    <<: *app-common
    ports:
      - "8000:8000"

  worker:
    <<: *app-common
    command: ["python", "-m", "app.scheduler.main"]
    # L'ordonnanceur n'expose pas de serveur HTTP : la sonde de l'image, qui
    # interroge /health, échouerait indéfiniment.
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    # CADDY_DOMAIN et CADDY_ACME_EMAIL sont résolus par Caddy lui-même
    # (`{$VAR}` dans le Caddyfile), donc lus dans l'environnement du conteneur.
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@iosys.fr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  pgadmin_data:
