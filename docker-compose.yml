name: prospect-crm

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: prospect-crm:local
  env_file:
    - .env
  environment:
    # Dans le réseau du compose, la base répond sur l'hôte `postgres`.
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crm:crm@postgres:5432/prospectcrm}
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - internal
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: prospectcrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d prospectcrm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  # Publication du port PostgreSQL sur l'hôte, RÉSERVÉE AU PROFIL dev
  # (psql, DBeaver, `make migrate` lancé depuis l'hôte).
  # Compose ne sait pas conditionner la clé `ports` d'un service à un profil :
  # le relais dev est donc un service distinct, absent du profil prod. En
  # production, la base n'est joignable que depuis le réseau interne.
  postgres-dev-port:
    image: alpine/socat:latest
    profiles: ["dev"]
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  app:
    <<: *app-common
    ports:
      - "8000:8000"

  worker:
    <<: *app-common
    command: ["python", "-m", "app.scheduler.main"]

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@iosys.fr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  pgadmin_data:
